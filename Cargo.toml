[package]
name = "monzoboiii"
version = "0.1.0"
edition = "2024"

[dependencies]
toml = "1.0.6"
anyhow = "1.0.102"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
axum = "0.8.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
urlencoding = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
